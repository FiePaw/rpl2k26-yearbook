<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - Yearbook RPL 2026</title>
    <link rel="stylesheet" href="/src/client/styles/loading.css">
    <link rel="stylesheet" href="/src/client/styles/style.css">
    <link rel="stylesheet" href="/src/client/styles/popup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Anime.js for advanced animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
</head>
<body>
    <header class="music-header">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fas fa-bars"></i>
        </button>
        <div class="header-left">
            <i class="fas fa-compact-disc spinning-slow"></i>
            <span class="header-title">RPL Yearbook 2026</span>
        </div>
        <nav class="header-nav">
            <a href="beranda"><i class="fas fa-home"></i> Home</a>
            <a href="kolase"><i class="fas fa-images"></i> Memories</a>
            <a href="wali-kelas" class="active"><i class="fas fa-star"></i> Teachers</a>
            <a href="#" id="profileLink"><i class="fas fa-user"></i> Profile</a>
        </nav>
        <div class="header-right">
            <button id="themeToggle" class="theme-btn">
                <i class="fas fa-moon"></i>
            </button>
            <button id="userBtn" class="user-btn">
                <i class="fas fa-user-circle"></i>
                <span id="userName">Login</span>
            </button>
        </div>
    </header>

    <!-- Mobile Sidebar Navigation -->
    <aside class="sidebar-nav" id="sidebarNav">
        <div class="sidebar-header">
            <i class="fas fa-compact-disc spinning-slow"></i>
            <span>RPL Yearbook 2026</span>
            <button class="sidebar-close" id="sidebarClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-menu">
            <a href="beranda" class="sidebar-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="kolase" class="sidebar-item">
                <i class="fas fa-images"></i>
                <span>Memories</span>
            </a>
            <a href="wali-kelas" class="sidebar-item active">
                <i class="fas fa-star"></i>
                <span>Teachers</span>
            </a>
            <a href="#" id="sidebarProfileLink" class="sidebar-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-theme-btn" id="sidebarThemeToggle">
                <i class="fas fa-moon"></i>
                <span>Dark Mode</span>
            </button>
        </div>
    </aside>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1><i class="fas fa-award"></i> Our Mentors</h1>
                <p>The conductors of our symphony</p>
            </div>

            <!-- Teacher Detail Display Form -->
            <div class="teacher-detail-form" id="teacherDetailForm" style="display: none;">
                <button class="close-detail-form" id="closeDetailForm">
                    <i class="fas fa-times"></i>
                </button>
                <div class="teacher-detail-content">
                    <div class="teacher-detail-photo">
                        <img id="detailPhoto" src="" alt="Teacher Photo">
                    </div>
                    <div class="teacher-detail-info">
                        <div class="teacher-badge">
                            <i class="fas fa-star"></i>
                            <span id="detailGrade">Grade</span>
                        </div>
                        <h2 id="detailName">Teacher Name</h2>
                        <div class="teacher-message-box">
                            <div class="message-header">
                                <i class="fas fa-quote-left"></i>
                                <span>Message to Students</span>
                            </div>
                            <p id="detailMessage">No message available...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="teachers-grid" id="teachersGrid">
                <!-- Teachers will be loaded here -->
            </div>
        </div>
    </main>

    <footer class="music-footer">
        <div class="footer-content">
            <div class="footer-left">
                <i class="fas fa-headphones"></i>
                <span>RPL Class of 2026</span>
            </div>
            <div class="footer-center">
                <div class="equalizer">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
            <div class="footer-right">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script src="/src/client/js/loading.js"></script>
    <script src="/src/client/js/image-optimizer.js"></script>
    <script src="/src/client/js/popup.js"></script>
    <script src="/src/client/js/enable-scroll.js"></script>
    <script src="/src/client/js/wali-kelas.js"></script>
    <script src="/src/client/js/activity-tracker.js"></script>
    <script src="/src/client/js/animations.js"></script>
</body>
</html>
